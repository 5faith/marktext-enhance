name: Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".opencode/**"
      - ".sisyphus/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - ".opencode/**"
      - ".sisyphus/**"
  workflow_dispatch:
    inputs:
      target:
        description: 'Build target (linux/mac/win/all)'
        required: true
        default: 'all'
        type: choice
        options:
          - linux
          - mac
          - win
          - all

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unix:
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'linux' ||
      inputs.target == 'mac'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      matrix:
        os: [macos-15, ubuntu-latest]

    env:
      DISPLAY: ":99.0"
      MARKTEXT_EXIT_ON_ERROR: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: yarn

      - name: Install build dependencies
        if: runner.os == 'Linux'
        #                         electron-builder                 | keyboard-layout         | keytar                      | fontmanager
        run: |
          sudo apt-get -y update
          sudo apt-get install -y icnsutils graphicsmagick xz-utils libx11-dev libxkbfile-dev gnome-keyring libsecret-1-dev libfontconfig-dev

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cacheNodeModules
        with:
          path: ${{ github.workspace }}/node_modules
          key: ${{ runner.os }}-node_modules-cache-${{ hashFiles(format('{0}{1}', github.workspace, '/yarn.lock')) }}
          restore-keys: |
            ${{ runner.os }}-node_modules-cache-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Linux' && '~/.cache/electron' || '~/Library/Caches/electron' }}
          key: ${{ runner.os }}-electron-cache-${{ hashFiles(format('{0}{1}', github.workspace, '/yarn.lock')) }}

      - name: Cache Electron-Builder
        uses: actions/cache@v4
        with:
          path: ${{ runner.os == 'Linux' && '~/.cache/electron-builder' || '~/Library/Caches/electron-builder' }}
          key: ${{ runner.os }}-electron-builder-cache-${{ hashFiles(format('{0}{1}', github.workspace, '/yarn.lock')) }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        if: ${{ steps.cacheNodeModules.outputs.cache-hit != 'true' }}
        run: yarn install --check-files

      - name: Patch native-keymap for C++20
        if: runner.os != 'Windows'
        run: |
          if ! grep -q 'std=c++20' node_modules/native-keymap/binding.gyp; then
            sed -i.bak 's|"sources":|"cflags_cc": ["-std=c++20"], "sources":|' node_modules/native-keymap/binding.gyp && rm -f node_modules/native-keymap/binding.gyp.bak
            echo "[CI] Patched native-keymap/binding.gyp"
          else
            echo "[CI] native-keymap/binding.gyp already patched"
          fi
          # Force node-gyp to regenerate Makefile from patched binding.gyp
          rm -rf node_modules/native-keymap/build
          # Patch electron-rebuild: change hardcoded -std=c++17 to -std=c++20
          sed -i.bak "s/-std=c++17/-std=c++20/g" node_modules/electron-rebuild/lib/src/module-type/node-gyp.js && rm -f node_modules/electron-rebuild/lib/src/module-type/node-gyp.js.bak
          echo "[CI] Patched electron-rebuild node-gyp.js: c++17 → c++20"

      - name: Rebuild native modules for Electron (unix)
        if: runner.os != 'Windows'
        run: npx electron-rebuild -f -w ced,cld,keytar,native-keymap,fontmanager-redux,keyboard-layout

      - name: Lint
        run: |
          yarn run lint
          yarn run validate-licenses

      - name: Run unit and E2E tests
        uses: GabrielBB/xvfb-action@v1
        with:
          run: yarn run test

      - name: Build
        run: yarn build:bin

  windows:
    if: |
      github.event_name != 'workflow_dispatch' ||
      inputs.target == 'all' ||
      inputs.target == 'win'
    runs-on: windows-latest
    timeout-minutes: 45

    env:
      MARKTEXT_EXIT_ON_ERROR: 1
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          check-latest: true
          cache: yarn

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cacheNodeModules
        with:
          path: ${{ github.workspace }}\node_modules
          key: ${{ runner.os }}-node_modules-cache-${{ hashFiles(format('{0}{1}', github.workspace, '\yarn.lock')) }}
          restore-keys: |
            ${{ runner.os }}-node_modules-cache-

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\electron\Cache
          key: ${{ runner.os }}-electron-cache-${{ hashFiles(format('{0}{1}', github.workspace, '\yarn.lock')) }}

      - name: Cache Electron-Builder
        uses: actions/cache@v4
        with:
          path: ${{ env.LOCALAPPDATA }}\electron-builder\cache
          key: ${{ runner.os }}-electron-builder-cache-${{ hashFiles(format('{0}{1}', github.workspace, '\yarn.lock')) }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python setuptools
        run: pip install setuptools

      - name: Install dependencies
        if: ${{ steps.cacheNodeModules.outputs.cache-hit != 'true' }}
        run: yarn install --check-files

      - name: Rebuild native modules for Electron (windows)
        run: npx electron-rebuild -f -w ced,cld,keytar,native-keymap,fontmanager-redux,keyboard-layout

      - name: Lint
        run: |
          yarn run lint
          yarn run validate-licenses

      - name: Run unit and E2E tests
        run: yarn run test

      - name: Build
        run: yarn build:bin
